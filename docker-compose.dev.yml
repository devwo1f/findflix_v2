# Development overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "true"
      ENVIRONMENT: development

  ml_service:
    command: uvicorn ml_service.app:app --host 0.0.0.0 --port 8001 --reload
    environment:
      DEBUG: "true"
    volumes:
      - ./ml_service:/app/ml_service

  celery_worker:
    command: celery -A app.tasks.celery_app worker --loglevel=debug --concurrency=1
